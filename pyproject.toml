[project]
name = "gabriel-career-bot"
version = "0.1.0"
description = "Interactive career assistant for resume building and interview prep."
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi (==0.141.1)",
    "uvicorn[standard] (==0.52.4)",
    "openai (==3.3.1)",
    "pydantic (==2.13.4)",
    "pydantic-settings (==2.15.0)",
    "python-dotenv (==1.2.3)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
